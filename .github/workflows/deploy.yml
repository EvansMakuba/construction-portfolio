name: Deploy Epistemic Engine to Vultr

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync files to Vultr Node
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "main.py,requirements.txt"
          target: "/var/www/portfolio"

      - name: Build Environment & Restart Daemon
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/portfolio
            
            # Initialize isolated Python environment if it doesn't exist
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            # Install dependencies
            ./venv/bin/pip install -r requirements.txt
            
            # Restart the Epistemic Engine
            systemctl restart epistemic
            
            echo "--- L7 Application Kernel Online ---"
